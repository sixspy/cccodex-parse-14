<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ lab }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/parse.css" />
</head>
<body>
  <header class="top">
    <div class="brand">{{ lab }}</div>
    {% if user %}
    <nav class="nav">
      <a href="/jobs/">落档列表</a>
      <a href="/policy/">幂等策略</a>
    </nav>
    <div class="who">{{ user }} · <a href="/logout">退出</a></div>
    {% endif %}
  </header>
  <main class="sheet">
    {% if messages %}
      <div class="msgs">
        {% for m in messages %}<p class="msg msg-{{ m.tags }}">{{ m }}</p>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
