<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ lab }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/parse.css" />
</head>
<body>

    <div class="brand">{{ lab }}</div>

  </header>
  <main class="sheet">{% block content %}{% endblock %}</main>
</body>
</html>
